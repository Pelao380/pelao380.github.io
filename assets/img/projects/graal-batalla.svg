<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" font-family="Consolas, 'JetBrains Mono', monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b1033"/><stop offset="1" stop-color="#3a1424"/></linearGradient>
    <radialGradient id="glow" cx=".85" cy=".2" r=".5"><stop offset="0" stop-color="#f5c451" stop-opacity=".35"/><stop offset="1" stop-color="#f5c451" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>
  <!-- Copa (grial) -->
