  <text x="1035" y="390" text-anchor="middle" font-family="Georgia, serif" font-size="58" font-weight="700" fill="#f5c451" letter-spacing="6">GRAAL</text>
  <text x="1035" y="428" text-anchor="middle" font-size="19" fill="#e9d9b0" opacity=".8">348 Servants · 628 pruebas</text>
  <text x="1035" y="456" text-anchor="middle" font-size="19" fill="#e9d9b0" opacity=".8">combate por turnos</text>
