  <rect x="60" y="60" width="790" height="520" rx="14" fill="#0e0c14" stroke="#ffffff" stroke-opacity=".08"/>
  <rect x="60" y="60" width="790" height="44" rx="14" fill="#1c1925"/><rect x="60" y="90" width="790" height="14" fill="#1c1925"/>
  <circle cx="90" cy="82" r="7" fill="#ff5f57"/><circle cx="114" cy="82" r="7" fill="#febc2e"/><circle cx="138" cy="82" r="7" fill="#28c840"/>
  <text x="455" y="88" text-anchor="middle" font-size="16" fill="#8d89a0">python tools/ver_batalla.py</text>
  <g font-size="20">
    <text x="90" y="148" fill="#8d89a0">--- Turno 2 ---</text>
    <text x="90" y="180" fill="#7dd3fc">Archer tiene ventaja sobre Saber.</text>
    <text x="90" y="212" fill="#e7e5ee">Hikari hace <tspan fill="#fca5a5">401</tspan> de daño a Rin <tspan fill="#8d89a0">(1109/1510)</tspan></text>
    <text x="90" y="244" fill="#e7e5ee">Rin hace <tspan fill="#fca5a5">218</tspan> de daño a Hikari <tspan fill="#8d89a0">(1190/1408)</tspan></text>
    <text x="90" y="292" fill="#8d89a0">--- Turno 6 ---</text>
    <text x="90" y="324" fill="#e7e5ee">Rin se pone en guardia.</text>
    <text x="90" y="356" fill="#fde68a">Golpe crítico.</text>
    <text x="90" y="388" fill="#e7e5ee">Rin bloquea parte del golpe.</text>
    <text x="90" y="436" fill="#8d89a0">--- Turno 8 ---</text>
    <text x="90" y="468" fill="#f5c451" font-weight="700">Hikari libera su Noble Fantasma.</text>
    <text x="90" y="500" fill="#e7e5ee">Hikari hace <tspan fill="#f87171" font-weight="700">1401</tspan> de daño a Rin <tspan fill="#8d89a0">(0/1510)</tspan></text>
    <text x="90" y="532" fill="#86efac">La batalla termina. Hikari queda en pie.</text>
    <rect x="90" y="550" width="12" height="22" fill="#e7e5ee" opacity=".7"/>
